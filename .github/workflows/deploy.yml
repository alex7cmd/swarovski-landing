# ------------------------------------------------------------------------------
# Publica en producción cada push a main.
#   https://www.commandigital.biz/share/swarovski/index.html
#
# Único secret necesario (Settings → Secrets and variables → Actions):
#
#   SSH_PRIVATE_KEY   contenido de ~/.ssh/commandigital_siteground
#
# Los demás datos de conexión van abajo en texto plano a propósito: no abren
# nada por sí solos, porque el servidor solo acepta autenticación por llave.
# ------------------------------------------------------------------------------
name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  SSH_HOST: ssh.commandigital.biz
  SSH_USER: u2645-1val7vrtblk8
  SSH_PORT: "18765"
  REMOTE_PATH: www/commandigital.biz/public_html/share/swarovski

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Red de seguridad: rsync corre con --delete, así que una ruta mal
      # escrita borraría la carpeta equivocada.
      - name: Validar destino
        run: |
          if [ -z "$REMOTE_PATH" ]; then
            echo "::error::REMOTE_PATH está vacío."; exit 1
          fi
          case "$REMOTE_PATH" in
            /*) echo "::error::REMOTE_PATH debe ser relativo al home, sin / inicial."; exit 1 ;;
            */share/swarovski) : ;;
            *) echo "::error::REMOTE_PATH debe terminar en share/swarovski."; exit 1 ;;
          esac
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Falta el secret SSH_PRIVATE_KEY."; exit 1
          fi
          echo "Destino validado: \$HOME/$REMOTE_PATH"

      - name: Sellar assets con su versión
        run: |
          bash tools/versionar.sh .
          bash tools/generar-index-php.sh .
          {
            echo "Publicado el $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: $GITHUB_SHA"
            echo "Origen: GitHub Actions (run #$GITHUB_RUN_NUMBER)"
          } > version.txt

      - name: Preparar clave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "IP de este runner: $(curl -s --max-time 10 https://api.ipify.org || echo 'no disponible')"

      # El hosting rechaza la conexión de vez en cuando (parece filtrado por IP).
      # Se reintenta, y si aun así falla se publica el motivo real en la pestaña
      # Actions en vez del genérico "exit code 1".
      - name: Conectar al servidor
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento de 3…"
            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=25 \
                 "$SSH_USER@$SSH_HOST" "mkdir -p \"\$HOME/$REMOTE_PATH\" && echo Conectado como \$(whoami)" 2> /tmp/ssh.err; then
              exit 0
            fi
            echo "Falló: $(tr '\n' ' ' < /tmp/ssh.err)"
            [ "$intento" -lt 3 ] && sleep 15
          done
          echo "::error::SSH falló tras 3 intentos → $(tr '\n' ' ' < /tmp/ssh.err)"
          exit 1

      - name: Sincronizar por rsync
        run: |
          set -o pipefail
          rsync -rlptzv --checksum --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude '.git/' --exclude '.github/' --exclude '.vscode/' \
            --exclude '.DS_Store' --exclude 'node_modules/' \
            --exclude 'assets/downloads/swarovski-impresos/' \
            --exclude 'tools/' --exclude 'deploy.sh' \
            --exclude '.gitignore' --exclude 'README.md' --exclude 'CLAUDE.md' \
            --exclude 'index.html' \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/" 2> /tmp/rsync.err || {
              echo "::error::rsync falló → $(tr '\n' ' ' < /tmp/rsync.err)"
              exit 1
            }

      - name: Resumen
        run: |
          echo "### ✅ Publicado" >> $GITHUB_STEP_SUMMARY
          echo "https://www.commandigital.biz/share/swarovski/index.html" >> $GITHUB_STEP_SUMMARY
